name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test .NET application
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CxShell.Tests/CxShell.Tests.csproj

      - name: Test
        run: dotnet test CxShell.Tests/CxShell.Tests.csproj --no-restore --configuration Release
